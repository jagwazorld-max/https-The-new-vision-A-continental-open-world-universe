name: CROWNLINE — validate and publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crownline-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package game
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required files
        run: |
          test -s index.html
          test -s styles.css
          test -s src/game.js
          grep -q 'src/game.js' index.html
          grep -q 'three@0.170.0' index.html

      - name: Check JavaScript syntax
        run: node --check src/game.js

      - name: Prepare clean Pages artifact
        run: |
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp src/game.js _site/src/game.js
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
